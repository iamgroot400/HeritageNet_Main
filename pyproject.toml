[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heritagenet"
version = "0.1.0"
description = "Local heritage site classification for on-device deployment"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["heritagenet*"]